<!DOCTYPE html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Алгоритми – интерактивен урок</title><style>
:root{--bg:#eaf1ef;--c:#fff;--tx:#14262b;--mu:#4d6469;--ac:#0f766e;--hi:#e9a100;--bad:#c2410c;--ln:#c5d4d1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1b1e;--c:#17282c;--tx:#e6f0ee;--mu:#9bb3b0;--ac:#34d1c0;--hi:#f2b632;--bad:#fb923c;--ln:#2c4349}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 "Segoe UI",Verdana,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--ac);color:#fff;display:flex;gap:8px;align-items:center;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
header b{flex:1}select{max-width:48vw;font:inherit;font-size:14px}
main{max-width:820px;margin:0 auto;padding:18px 14px 90px}
h2{font:700 1.7rem/1.2 Georgia,"Times New Roman",serif;margin:.2em 0 .6em}
.card{background:var(--c);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin:12px 0}
button{font:inherit;cursor:pointer;border:2px solid var(--ac);background:var(--c);color:var(--tx);border-radius:8px;padding:6px 12px;margin:3px}
button.on,button:hover{background:var(--ac);color:#fff}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--hi)}
input{font:inherit;width:90px;padding:5px;border:2px solid var(--ln);border-radius:6px;background:var(--c);color:var(--tx)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:10px;align-items:center;background:var(--c);border-top:1px solid var(--ln);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.ok{color:var(--ac);font-weight:700}.no{color:var(--bad);font-weight:700}.mu{color:var(--mu)}
details{background:var(--c);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;margin:8px 0}summary{cursor:pointer;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.jug{width:86px;text-align:center;cursor:pointer}
.jb{height:160px;border:3px solid var(--tx);border-top:0;display:flex;align-items:flex-end;border-radius:0 0 12px 12px}.jb i{display:block;width:100%;background:var(--ac);opacity:.75;transition:height .3s}.sel .jb{border-color:var(--hi)}
.peg{width:30%;min-width:96px;min-height:140px;border-bottom:6px solid var(--tx);display:flex;flex-direction:column-reverse;align-items:center;cursor:pointer;padding-bottom:2px}.peg.sel{border-color:var(--hi)}.dk{height:24px;margin-top:3px;border-radius:6px;background:var(--ac);color:#fff;text-align:center}
.fs{display:flex;flex-direction:column;align-items:center;gap:2px}.fs div{padding:7px 18px;background:var(--c);border:2px solid var(--ac);text-align:center;min-width:200px}.ov{border-radius:99px}.pa{clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);background:var(--ac)!important;color:#fff}.di{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);padding:22px 40px!important;background:var(--hi)!important;color:#000}.sb{border-left:6px double var(--ac)!important;border-right:6px double var(--ac)!important}.ar:after{content:"↓";color:var(--mu)}
pre{background:#0d1d20;color:#d8f3ee;padding:12px;border-radius:8px;overflow-x:auto}.w{overflow-x:auto}
.pt{float:right;width:300px;max-width:48%;margin:0 0 10px 14px;border-radius:8px}.sc{display:flex;border-radius:12px;overflow:hidden;border:2px solid var(--ln)}.bk{flex:1;background:#a9d18e;min-height:280px;padding:10px;font-size:3rem;display:flex;flex-wrap:wrap;gap:6px;align-content:center;color:#000}.bk button{font-size:3rem;padding:4px 12px;line-height:1}.fm{font-size:3.4rem}.rv{position:relative;flex:0 0 42%;background:#5aa9d6;display:flex;align-items:center;font-size:5.5rem;padding:0 6px}.sh{position:relative;height:240px;background:#3d8fb0;border:3px solid var(--tx);border-top:0;margin:-4px 14px 0}#snl{position:absolute;left:50%;transform:translateX(-50%);width:34px;transition:bottom .6s}.cn{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#d9a520);border:3px solid #8a6a00;color:#3a2a00;font-weight:700;padding:0}button.cn:hover{background:radial-gradient(circle at 35% 30%,#fff2b8,#e8b830);color:#3a2a00}.cn.sel{outline:4px solid var(--ac)}.wt{position:relative;height:96px;margin:0 14px}.roof{position:absolute;top:0;left:-16px;right:-16px;height:36px;background:#a0522d;clip-path:polygon(50% 0,100% 100%,0 100%)}.pst{position:absolute;top:36px;bottom:0;width:9px;background:#6b4a2b}.axl{position:absolute;top:44px;left:6px;right:6px;height:6px;background:#6b4a2b}.ttl{font-size:clamp(2.6rem,9vw,4.4rem);text-align:center;margin:.7em 0 .2em;color:var(--ac)}.lily{position:absolute;bottom:10px;left:50%;transform:translateX(-50%)}.hero{display:block;width:100%;max-width:480px;margin:14px auto 22px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.25)}button.run{background:#15803d;border-color:#15803d;color:#fff;font-weight:700}button.run:hover{background:#166534}button.clr{border-color:var(--bad);color:var(--bad)}button.clr:hover{background:var(--bad);color:#fff}button.sub{background:#7c3aed;border-color:#7c3aed;color:#fff}button.sub:hover{background:#6d28d9}button.sub.on{background:#4c1d95;outline:3px solid var(--hi)}</style></head><body><header><b>Алгоритми</b><select id="s" aria-label="Слайд"></select><span id="p"></span></header><main id="m"></main>
<nav><button onclick="go(i-1)">◀ Назад</button><button onclick="go(i+1)">Напред ▶</button></nav>
<script>
const $=s=>document.querySelector(s);let i=0;
const H={a2:["Подсказка: за всяка монета се изпълняват стъпки 1, 2, 3 и 4. Колко стъпки са това за 2 монети и какво става, когато джобът се изпразни?","Всяка монета отнема 4 стъпки (1–4), общо 8. След това: стъпка 1, стъпка 2 (няма монета, прекратяваме) и стъпка 5 – още 3. Общо 8+3=11."],a0:["Подсказка: проследи алгоритъма при празен джоб. Кои стъпки се изпълняват, преди да прекратиш?","Стъпка 1 (бръкваш), стъпка 2 (няма монета, прекратяваш) и стъпка 5. Цикълът изобщо не се върти, затова са само 3 стъпки."],n6:["Подсказка: не са 6. В последния ден охлювът излиза и вече не слиза. Проследи със „Ново денонощие“.","След 4 денонощия е на 4 м. В 5-ото изкачва 2 м и излиза на 6 м, без да слиза."],n12:["Подсказка: пробвай с бутона при дълбочина 12 м и помни, че в последния ден няма слизане.","След 10 денонощия е на 10 м, а на 11-ото изкачва 2 м и излиза."],c6:["Подсказка: брой само пълните повторения „нагоре и надолу“. Последното изкачване е само нагоре.","Четири пълни повторения (до 4 м), а петото изкачване е само нагоре."]};
const chk=(a,v,o)=>{const k=a.slice(1),r=+$(a).value===v;$(o).innerHTML=r?'<span class=ok>✓ Верно!</span> '+(H[k]?H[k][1]:''):'<span class=no>✗ Не е точно.</span> '+(H[k]?H[k][0]:'')};
const Q=(id,v,l)=>`<p>${l} <input id=${id} type=number> <button onclick="chk('#${id}',${v},'#${id}r')">Провери</button> <span id=${id}r></span></p>`;
const D=(q,a)=>`<details><summary>${q}</summary><p>${a}</p></details>`;
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const S=[
{t:"Алгоритми",h:`<div class=card><p>Интерактивен урок. Цялата теория е запазена, а примерите са упражнения и игри. Движи се с бутоните долу или от падащото меню горе.</p></div>`},
{t:"1. Произход на думата алгоритъм",h:`<p>Абу Джафар Мохамед ибн Муса ал Хорезми е арабски математик, описал:</p><ul><li>представянето на числата в 10-ична бройна система;</li><li>извършването на аритметичните операции с тях.</li></ul>`},
{t:"Какво е алгоритъм",h:`<div class=card><p>Термин, с който се означава крайна поредица от инструкции или изрично описание на постъпкова процедура за решаване на даден проблем, често свързан с изчисление или обработка на данни.</p></div>`},
{t:"Пример: покупка на стоки",h:`<p>Купувач купува стоки на килограм с тегло k1, k2, k3 и цени c1, c2, c3. Да се изчисли дължимата сума.</p><div class=card>Тегла: <input id=k1 type=number value=2> <input id=k2 type=number value=1> <input id=k3 type=number value=3><br>Цени: <input id=c1 type=number value=3> <input id=c2 type=number value=4> <input id=c3 type=number value=2></div><button onclick=nx()>Следваща стъпка</button><button onclick=go(3)>Отначало</button><div id=o class=card></div>`,f(){n=0;window.nx=()=>{const v=x=>+$('#'+x).value,L=["S1=k1·c1 = "+v('k1')*v('c1'),"S2=k2·c2 = "+v('k2')*v('c2'),"S3=k3·c3 = "+v('k3')*v('c3'),"S=S1+S2+S3 = "+(v('k1')*v('c1')+v('k2')*v('c2')+v('k3')*v('c3')),"Отговор: сумата за плащане е S"];if(n<5)$('#o').innerHTML+=(n+1)+") "+L[n++]+"<br>"}}},
{t:"Съставител, изпълнител, потребител",h:`<p>Алгоритъмът е множество от обекти и съвкупност от операции с тях. Участват трима. Отвори всеки:</p>${D("Съставител","Създава последователност от елементарни действия.")}${D("Изпълнител","Изпълнява елементарните действия (стъпки).")}${D("Потребител","Задава начално състояние (входна информация) и достига до резултат (изходна информация).")}`},
{t:"Вход и изход",h:`<div class=card><p>Всеки алгоритъм започва от определено начално състояние (входна информация) и достига до резултат (изходна информация – друго крайно състояние).</p><p>Наборът от допустими елементарни действия се определя от възможностите на изпълнителя.</p></div>`},
{t:"Свойства на алгоритмите",h:`<p>Отвори свойство и си обясни с думи какво означава, преди да прочетеш.</p>${D("Дискретност","краен брой стъпки")}${D("Яснота","изпълнителят може да изпълни всяка стъпка")}${D("Формалност","автоматично изпълнение, без вземане на решение")}${D("Определеност","при едни и същи входни данни винаги се достига до един и същ резултат")}${D("Масовост","прилага се за клас от задачи (с различни входни данни)")}${D("Крайност","винаги достига до край, независимо от входните данни")}${D("Резултатност","винаги има резултат, независимо от входните данни")}${D("Ефективност","рационалност, влияе върху бързината на изпълнение")}`},
{t:"Кои свойства липсват?",h:`<div class=card>Стъпка 1: Извади монета от джоба си<br>Стъпка 2: Постави я на масата<br>Стъпка 3: Премини към Стъпка 1</div><p>Кои свойства не притежава този алгоритъм? Промени го така, че да ги притежава.</p>${D("Отговор","Няма крайност и резултатност (цикълът е безкраен) и затова не е дискретен. Поправка: виж алгоритъма на следващия слайд, където има проверка „Ако имаш монета“.")}`},
{t:"Игра 1: Монетите в джоба",h:`<div class=card>Стъпка 1: Бръкни в джоба си.<br>Стъпка 2: Ако имаш монета, я извади, в противен случай прекрати.<br>Стъпка 3: Постави я на масата.<br>Стъпка 4: Премини към Стъпка 1.<br>Стъпка 5: Прекрати.</div><p>Брой изпълнени стъпки (всяко преминаване брои като стъпка):</p>${Q("a2",11,"Ако в джоба има 2 монети:")}${Q("a0",3,"Ако в джоба няма монети:")}<p>Ако има N монети, стъпките са:</p><button onclick="r9(1)">2N</button><button onclick="r9(2)">4N+3</button><button onclick="r9(3)">N+5</button><span id=r9></span>`,f(){window.r9=k=>$('#r9').innerHTML=k==2?' <span class=ok>✓ Всяка монета струва 4 стъпки (1–4), накрая 1, 2, 5.</span>':' <span class=no>✗ Пробвай с 2 монети.</span>'}},
{t:"Игра 2: Три съда",h:`<p>Съдове от 8, 5 и 3 литра, пълният е първият. Раздели водата на две равни части (4 и 4). Натисни съд, от който да преливаш, после съд, в който да преливаш.</p><div class=row id=j></div><p id=jm></p><button onclick=wa()>Отначало</button>`,f(){const cp=[8,5,3];let st,se,mv;window.wa=()=>{st=[8,0,0];se=-1;mv=0;dr()};const dr=()=>{$('#j').innerHTML=cp.map((c,k)=>`<div class="jug ${se==k?'sel':''}" onclick=pj(${k})><div class=jb><i style="height:${st[k]/8*100}%"></i></div><b>${st[k]}</b> / ${c} л</div>`).join('');$('#jm').innerHTML='Ходове: '+mv+(st.filter(x=>x==4).length==2?' <span class=ok>✓ Браво! Записа ли стъпките като алгоритъм?</span>':'')};window.pj=k=>{if(se<0){se=k}else{if(se!=k){const a=Math.min(st[se],cp[k]-st[k]);if(a>0){st[se]-=a;st[k]+=a;mv++}}se=-1}dr()};wa()}},
{t:"Игра 3: Вълк, коза и зеле",h:`<p>Превози вълка, козата и зелето на другия бряг с една лодка, която побира само един обект (освен теб). Вълкът не може да остане с козата, нито козата със зелето, когато не си при тях.</p><div class=card id=w></div><div id=wb></div><p id=wm></p><button onclick=ww()>Отначало</button>`,f(){const N=["Вълк","Коза","Зеле"];let p,b,mv;window.ww=()=>{p=[0,0,0];b=0;mv=0;$('#wm').textContent='';dr()};const dr=()=>{const l=N.filter((x,k)=>p[k]==0).join(', ')||'-',r=N.filter((x,k)=>p[k]==1).join(', ')||'-';$('#w').innerHTML=`Ляв бряг: <b>${l}</b> ${b==0?'🛶':''}<br>Десен бряг: <b>${r}</b> ${b==1?'🛶':''}`;$('#wb').innerHTML=`Превози: <button onclick=wm(-1)>Сам</button>`+N.map((x,k)=>p[k]==b?`<button onclick=wm(${k})>${x}</button>`:'').join('')};window.wm=k=>{const q=p.slice();if(k>=0)q[k]=1-b;const o=1-b,bad=(q[0]==o&&q[1]==o)||(q[1]==o&&q[2]==o);if(bad){$('#wm').innerHTML='<span class=no>✗ Някой е изяден! Опитай друг ход.</span>';return}p=q;b=o;mv++;$('#wm').innerHTML=p.every(x=>x==1)?`<span class=ok>✓ Готово за ${mv} хода (най-малко 7).</span>`:'Ходове: '+mv;dr()};ww()}},
{t:"Игра 4: Ханойски кули",h:`<p>Прехвърли дисковете от левия на десния пилон. Можеш да слагаш само по-малък диск върху по-голям. Натисни пилон-източник, после пилон-цел.</p><div class=row id=h style="align-items:flex-end"></div><p id=hm></p><button onclick=hh()>Отначало</button>`,f(){let g,se,mv;window.hh=()=>{g=[[3,2,1],[],[]];se=-1;mv=0;dr()};const dr=()=>{$('#h').innerHTML=g.map((d,k)=>`<div class="peg ${se==k?'sel':''}" onclick=hp(${k})>`+d.map(z=>`<div class=dk style="width:${z*30}%">${z}</div>`).join('')+'</div>').join('');$('#hm').innerHTML=g[2].length==3?`<span class=ok>✓ Решено за ${mv} хода (най-малко 7).</span>`:'Ходове: '+mv};window.hp=k=>{if(se<0){if(g[k].length)se=k}else{const a=g[se],b=g[k];if(se!=k){if(!b.length||b[b.length-1]>a[a.length-1]){b.push(a.pop());mv++}else $('#hm').innerHTML='<span class=no>✗ Голям диск върху малък не може.</span>'}se=-1}dr()};hh()}},
{t:"Игра 5: Охлювът в кладенеца",h:`<p>Охлюв се катери от дъното на кладенец. За 1 денонощие минава 2 м нагоре и 1 м надолу. Дълбочина (м): <input id=dp type=number value=6> <button onclick=sn(1)>Ново денонощие</button><button onclick=sn(0)>Отначало</button></p><div class=card id=sl>Натисни „Ново денонощие“.</div>${Q("n6",5,"За колко денонощия ще излезе при 6 м?")}${Q("n12",11,"А при 12 м?")}${Q("c6",4,"Колко пъти се повтарят „2 м нагоре и 1 м надолу“ при 6 м?")}`,f(){let d=0,x=0;window.sn=k=>{const D=+$('#dp').value;if(!k){d=0;x=0;$('#sl').textContent='';return}if(x>=D)return;d++;x+=2;let t=`Денонощие ${d}: нагоре до ${x} м`;if(x>=D)t+=' <b class=ok>– излезе!</b>';else x--,t+=`, надолу до ${x} м`;$('#sl').innerHTML+=t+'<br>'}}},
{t:"Подалгоритъм",h:`<p>Велосипедист в т. А, движещ се на изток, пита как да стигне до кръстовището В. „Продължете направо, завийте наляво по първата пряка и след една пряка сте в т. В.“ А ако може да завива само надясно?</p><div class=card>Завой наляво = три пъти последователно „завий надясно“.</div><p>Тази последователност от елементарни действия за завой наляво наричаме <b>подалгоритъм</b>. Чрез него записваме придвижването от А до В по-просто.</p>${D("Опитай","Запиши пътя А→В с подалгоритъма „Наляво“: Направо, Наляво, Напред една пряка.")}`},
{t:"Начини на описание на алгоритмите",h:`<p>Алгоритъмът се описва <b>словесно</b>, с <b>блок-схема</b> и на <b>програмен език</b>. При съставянето му е необходимо:</p><ul><li>сложното действие да се представи чрез последователност от по-прости действия, достъпни за изпълнителя;</li><li>да се използват само елементарни (за изпълнителя) действия;</li><li>да се опише ясно и точно последователността на изпълнение.</li></ul><h3>А. Едно и също нещо по три начина</h3><div class=card>Задача: сума за плащане при покупка (слайд 4).<br><button class=on onclick=tb(0,this)>Словесно</button><button onclick=tb(1,this)>Блок-схема</button><button onclick=tb(2,this)>Програмен език</button><div id=tv class=w></div></div><h3>Б. Подреди блок-схемата</h3><p>Натискай блоковете в правилния ред, за да построиш схемата (S1, S2, S3 могат да са в произволен ред).</p><div id=bk></div><div class=card><div class=fs id=fl></div><p id=fm></p></div><h3>В. Кой начин е това?</h3><div id=cl></div><p id=cs></p>`,f(){const T=[`<p>1) S1=k1·c1<br>2) S2=k2·c2<br>3) S3=k3·c3<br>4) S=S1+S2+S3<br>Отговор: сумата за плащане е S</p>`,`<div class=fs><div class=ov>Начало</div><i class=ar></i><div class=pa>Вход: k1,k2,k3,c1,c2,c3</div><i class=ar></i><div>S1=k1·c1; S2=k2·c2; S3=k3·c3</div><i class=ar></i><div>S=S1+S2+S3</div><i class=ar></i><div class=pa>Изход: S</div><i class=ar></i><div class=ov>Край</div></div>`,`<pre>k1,k2,k3 = 2,1,3
c1,c2,c3 = 3,4,2

Object.assign(S[10],{h:`<p>Превози вълка, козата и зелето на другия бряг. Лодката побира теб (земеделеца) и най-много един обект. Не оставяй вълка с козата, нито козата със зелето без теб.</p><div class=sc><div class=bk id=bl></div><div class=rv id=rv>🛶<svg class=lily viewBox="0 0 60 40" width=72 height=48><ellipse cx=30 cy=31 rx=27 ry=8 fill="#2f9e5b" /><g fill="#f7b6d2" stroke="#d6709b"><ellipse cx=30 cy=19 rx=6 ry=13 transform="rotate(-45 30 30)" /><ellipse cx=30 cy=19 rx=6 ry=13 transform="rotate(45 30 30)" /><ellipse cx=30 cy=17 rx=6 ry=13 /></g></svg></div><div class=bk id=br></div></div><p>Натисни обект на твоя бряг, за да го превозиш, или плавай сам.</p><button onclick="wgo(-1)">Плавай сам</button><button onclick=ww()>Отначало</button><p id=wmsg></p>`,f(){const CB='<svg viewBox="0 0 40 40" width=52 height=52><circle cx=20 cy=22 r=16 fill="#6abf4b" /><path d="M20 6C8 14 8 30 20 38M20 6C32 14 32 30 20 38M20 6V38" stroke="#2f7d32" fill=none stroke-width=2 /></svg>',FR='<svg viewBox="0 0 40 60" width=48 height=72><ellipse cx=20 cy=13 rx=18 ry=5 fill="#d9a520" /><path d="M11 12a9 9 0 0 1 18 0z" fill="#e8b830" /><circle cx=20 cy=19 r=8 fill="#f2c9a0" /><rect x=9 y=28 width=22 height=22 rx=7 fill="#2563a8" /><rect x=12 y=50 width=6 height=9 fill="#5b3a1e" /><rect x=22 y=50 width=6 height=9 fill="#5b3a1e" /></svg>',N=["🐺","🐐",CB];let p,b,mv;const dr=()=>{[0,1].forEach(s=>$(s?'#br':'#bl').innerHTML=(b==s?'<span class=fm>'+FR+'</span>':'')+N.map((x,k)=>p[k]!=s?'':b==s?`<button onclick=wgo(${k}) aria-label="Превози">${x}</button>`:`<span>${x}</span>`).join(''));$('#rv').style.justifyContent=b?'flex-end':'flex-start'};window.ww=()=>{p=[0,0,0];b=0;mv=0;$('#wmsg').textContent='';dr()};window.wgo=k=>{const q=p.slice();if(k>=0)q[k]=1-b;const bad=(q[0]==b&&q[1]==b)||(q[1]==b&&q[2]==b);if(bad){$('#wmsg').innerHTML='<span class=no>✗ Без теб на оставения бряг вълкът изяжда козата или козата изяжда зелето. Опитай друг ход.</span>';return}p=q;b=1-b;mv++;$('#wmsg').innerHTML=p.every(x=>x==1)?`<span class=ok>✓ Готово за ${mv} хода (най-малко 7).</span>`:'Ходове: '+mv;dr()};ww()}});
Object.assign(S[12],{h:`<div class=row style="align-items:flex-start"><div style="width:170px"><div class=wt><div class=roof></div><i class=pst style="left:6px"></i><i class=pst style="right:6px"></i><i class=axl></i></div><div class=sh><img id=snl src="${IMG.sn}" alt="Охлюв"></div></div><div style="flex:1;min-width:240px"><p>Охлюв се катери от дъното на кладенец. За 1 денонощие минава 2 м нагоре и 1 м надолу. Дълбочина (м): <input id=dp type=number value=6 min=2 max=20> <button onclick=sn(1)>Ново денонощие</button><button onclick=sn(0)>Отначало</button></p><div class=card id=sl>Натисни „Ново денонощие“.</div></div></div>${Q("n6",5,"За колко денонощия ще излезе при 6 м?")}${Q("n12",11,"А при 12 м?")}${Q("c6",4,"Колко пъти се повтарят „2 м нагоре и 1 м надолу“ при 6 м?")}`,f(){let d=0,x=0,bz=0;const ps=()=>{const D=+$('#dp').value||6,r=Math.min(x/D,1);$('#snl').style.bottom=`calc(${r*100}% - ${r*61}px)`};window.sn=k=>{if(bz)return;const D=+$('#dp').value||6;if(!k){d=0;x=0;$('#sl').textContent='';ps();return}if(x>=D)return;d++;x+=2;ps();let t=`Денонощие ${d}: нагоре до ${Math.min(x,D)} м`;if(x>=D){$('#sl').innerHTML+=t+' <b class=ok>– излезе!</b><br>';return}bz=1;$('#sl').innerHTML+=t;setTimeout(()=>{x--;ps();$('#sl').innerHTML+=`, надолу до ${x} м<br>`;bz=0},700)};ps()}});
Object.assign(S[13],{h:`<p>Велосипедист в т. A, движещ се на изток, пита как да стигне до кръстовището B: „Продължете направо до първата пряка, завийте наляво, после надясно, карайте до края на улицата и завийте наляво – там е т. B.“ Но той <b>може да завива само надясно</b>. Може ли да стигне до B? Съставѝ програма с бутоните и я изпълни.</p><svg id=mp viewBox="0 0 500 330" style="width:100%;max-width:520px;display:block" role=img aria-label="Карта на улиците"></svg><div class=card><b>Програма:</b> <span id=pg>-</span></div><p><button onclick="pad('F')">Напред</button><button onclick="pad('R')">Надясно</button><span id=lb></span> <button class=run onclick=prun()>▶ Изпълни</button><button class=clr onclick=pclr()>✕ Изчисти</button></p><div class=card><b>Подалгоритъм:</b> натисни стъпки от програмата, за да ги избереш (една след друга), дай им име и ги групирай.<br><input id=nm placeholder="име, напр. Наляво" style="width:200px"> <button onclick=pgrp()>Групирай избраните стъпки</button><span id=df class=mu></span></div><p id=cmsg></p><p>Тази последователност от елементарни действия, необходими за завой наляво, наричаме <b>подалгоритъм</b>. Чрез него можем да запишем придвижването от A до B по-просто.</p>`,f(){const XS=[70,190,310,430],YS=[60,170,280];let pr=[],sl=new Set(),defs={},x,y,d,tr,bz=0;const lab=c=>c=='F'?'Напред':c=='R'?'Надясно':c.slice(2),ex=c=>c[0]=='S'?defs[c.slice(2)].flatMap(ex):[c];const dr=()=>{let s='<rect width=500 height=330 rx=12 fill="#c9e4bd" />';YS.forEach(v=>s+=`<line x1=20 y1=${v} x2=480 y2=${v} stroke="#7b8790" stroke-width=34 />`);s+=`<line x1=${XS[1]} y1=${YS[2]} x2=${XS[1]} y2=${YS[1]} stroke="#7b8790" stroke-width=34 /><line x1=${XS[3]} y1=${YS[1]} x2=${XS[3]} y2=${YS[0]} stroke="#7b8790" stroke-width=34 />`;s+=`<circle cx=${XS[0]} cy=${YS[2]} r=24 fill=none stroke="#15803d" stroke-width=4 /><circle cx=${XS[3]} cy=${YS[0]} r=24 fill=none stroke="#c2410c" stroke-width=4 stroke-dasharray="6 4" /><g font-size=18 font-weight=700 text-anchor=middle fill="#fff"><circle cx=${XS[0]-40} cy=${YS[2]-44} r=15 fill="#15803d" /><text x=${XS[0]-40} y=${YS[2]-38}>A</text><circle cx=${XS[3]+45} cy=${YS[0]+48} r=15 fill="#c2410c" /><text x=${XS[3]+45} y=${YS[0]+54}>B</text></g><polyline points="${tr.map(p=>XS[p[0]]+','+YS[p[1]]).join(' ')}" fill=none stroke="#1d4ed8" stroke-width=4 stroke-dasharray="8 6" /><g transform="translate(${XS[x]} ${YS[y]}) rotate(${d*90})"><polygon points="16,0 -12,-12 -12,12" fill="#c2410c" stroke="#fff" stroke-width=2 /></g>`;$('#mp').innerHTML=s;$('#pg').innerHTML=pr.length?pr.map((c,i)=>`<button class="${(sl.has(i)?'on':'')+(c[0]=='S'?' sub':'')}" onclick=psel(${i})>${lab(c)}</button>`).join(''):'-'};const rs=()=>{x=0;y=2;d=0;tr=[[0,2]];dr()};window.pad=c=>{if(bz)return;pr.push(c);sl.clear();$('#cmsg').textContent='';rs()};window.pclr=()=>{if(bz)return;pr=[];sl.clear();$('#cmsg').textContent='';rs()};window.psel=i=>{if(bz)return;sl.has(i)?sl.delete(i):sl.add(i);dr()};window.pgrp=()=>{const m=$('#cmsg'),nm=$('#nm').value.trim(),ix=[...sl].sort((a,b)=>a-b);if(bz)return;if(!ix.length){m.innerHTML='<span class=no>Първо избери стъпки от програмата.</span>';return}if(ix[ix.length-1]-ix[0]+1!=ix.length){m.innerHTML='<span class=no>Избраните стъпки трябва да са една след друга.</span>';return}if(!/^[\p{L}\p{N} _-]{1,20}$/u.test(nm)){m.innerHTML='<span class=no>Дай име на подалгоритъма (до 20 букви или цифри).</span>';return}if(nm=='Напред'||nm=='Надясно'||defs[nm]){m.innerHTML='<span class=no>Това име вече се ползва. Избери друго.</span>';return}defs[nm]=pr.slice(ix[0],ix[0]+ix.length);pr.splice(ix[0],ix.length,'S:'+nm);sl.clear();$('#nm').value='';$('#lb').innerHTML+=`<button class=sub onclick="pad('S:${nm}')">${nm}</button>`;$('#df').innerHTML=Object.keys(defs).map(k=>`<br><b>${k}</b> = ${defs[k].map(lab).join(', ')}`).join('');m.textContent='Създаде подалгоритъма „'+nm+'“. Вече можеш да го добавяш като една команда.';rs()};window.prun=()=>{if(bz||!pr.length)return;rs();const q=pr.flatMap(ex);bz=1;let i=0;const m=$('#cmsg');m.textContent='';const st=()=>{if(i>=q.length){bz=0;if(x==3&&y==0)m.innerHTML='<span class=ok>✓ Стигна до B!</span> '+(pr.some(c=>c[0]=='S')?`Програмата има ${pr.length} команди, а без подалгоритми щеше да има ${q.length}.`:'Групирай повтарящи се стъпки в подалгоритъм (например три пъти „Надясно“) и програмата ще стане по-кратка.');else m.innerHTML='<span class=no>✗ Не си в B.</span> Подсказка: завой наляво е три завоя надясно, а улиците свързват редовете само на две места.';return}const c=q[i++];if(c=='R')d=(d+1)%4;else{const nx=x+[1,0,-1,0][d],ny=y+[0,1,0,-1][d];if(nx<0||nx>3||ny<0||ny>2||(ny!=y&&!((x==1&&ny+y==3)||(x==3&&ny+y==1)))){m.innerHTML='<span class=no>✗ Там няма улица.</span>';bz=0;return}x=nx;y=ny;tr.push([x,y])}dr();setTimeout(st,650)};setTimeout(st,300)};rs()}});
const FC={t:"Игра: Фалшивата монета",h:`<div class=card><p>Дадени са 9 еднакви по външен вид монети. Една е фалшива – по-лека или по-тежка от истинските. Със само три претегляния посочи фалшивата монета и определи дали е по-лека или по-тежка.</p><p class=mu>Натисни монета, после натисни лявото или дясното блюдо. Натисни монета на блюдото, за да я върнеш. „Претегли“ накланя везната.</p></div><div id=fc class=row style="min-height:60px"></div><svg id=sv viewBox="0 0 600 300" style="width:100%;max-width:600px;display:block;margin:auto" role=img aria-label="Везна"></svg><p><button onclick=fw()>Претегли</button> Остават претегляния: <b id=wl></b></p><div id=wh class=card></div><p>Отговор: монета <select id=gc></select> е <button onclick=fg(-1)>по-лека</button><button onclick=fg(1)>по-тежка</button> <button onclick=fn()>Нова игра</button></p><p id=fm2></p>${D("Подсказка","Раздели монетите на три групи по три. Претегли 1, 2, 3 срещу 4, 5, 6. Ако везната е в равновесие, фалшивата е сред 7, 8, 9, а 1–6 са истински и можеш да ги ползваш за еталон. Ако не е в равновесие, фалшивата е сред шестте, а 7, 8, 9 са истински.")}`,f(){let fk,hv,pl,wl,sel,th=0,bz=0;const pc=(s,ex,ey)=>{const ids=pl.map((v,k)=>v==s?k:-1).filter(k=>k>=0);return `<g data-p="${s}"><line x1=${ex} y1=${ey} x2=${ex-70} y2=${ey+85} stroke="var(--tx)" stroke-width=2 /><line x1=${ex} y1=${ey} x2=${ex+70} y2=${ey+85} stroke="var(--tx)" stroke-width=2 /><rect x=${ex-85} y=${ey+85} width=170 height=12 rx=6 fill="var(--ac)" /><rect x=${ex-85} y=${ey+15} width=170 height=85 fill="transparent" />`+ids.map((k,i)=>{const cx=ex-60+(i%4)*40,cy=ey+66-Math.floor(i/4)*40;return `<g data-c="${k}" style="cursor:pointer"><circle cx=${cx} cy=${cy} r=19 fill="#e0b020" stroke="#8a6a00" stroke-width=3 /><text x=${cx} y=${cy+6} text-anchor=middle font-size=16 font-weight=700 fill="#3a2a00">${k+1}</text></g>`}).join('')+'</g>'};const dr=()=>{const a=th*Math.PI/180,c=Math.cos(a),s=Math.sin(a),lx=300-210*c,ly=70-210*s,rx=300+210*c,ry=70+210*s;$('#sv').innerHTML=`<path d="M230 290h140l-14-18h-112z" fill="var(--tx)" /><rect x=296 y=70 width=8 height=205 fill="var(--tx)" /><line x1=${lx} y1=${ly} x2=${rx} y2=${ry} stroke="var(--tx)" stroke-width=8 stroke-linecap=round /><circle cx=300 cy=70 r=10 fill="var(--hi)" />`+pc(1,lx,ly)+pc(2,rx,ry);$('#fc').innerHTML=pl.map((v,k)=>v?'':`<button class="cn${sel==k?' sel':''}" onclick=fp(${k})>${k+1}</button>`).join('');$('#wl').textContent=wl};const an=to=>{const f=th,t0=performance.now();bz=1;const st=n=>{const k=Math.min(1,(n-t0)/800);th=f+(to-f)*(1-Math.pow(1-k,3));dr();if(k<1)requestAnimationFrame(st);else bz=0};requestAnimationFrame(st)};const lv=()=>th?an(0):dr();$('#sv').onclick=e=>{if(bz)return;const c=e.target.closest('[data-c]'),p=e.target.closest('[data-p]');if(c){pl[+c.dataset.c]=0;lv()}else if(p&&sel!=null){pl[sel]=+p.dataset.p;sel=null;lv()}};window.fp=k=>{sel=sel==k?null:k;dr()};window.fn=()=>{fk=Math.floor(Math.random()*9);hv=Math.random()<.5?-1:1;pl=Array(9).fill(0);wl=3;sel=null;th=0;$('#wh').innerHTML='Резултати от претеглянията:<br>';$('#fm2').textContent='';$('#gc').innerHTML=pl.map((v,k)=>`<option>${k+1}</option>`).join('');dr()};window.fw=()=>{const m=$('#fm2');if(bz)return;if(wl<1){m.innerHTML='<span class=no>Претеглянията свършиха. Дай отговор.</span>';return}const L=[],R=[];pl.forEach((v,k)=>v==1?L.push(k):v==2&&R.push(k));if(!L.length||L.length!=R.length){m.innerHTML='<span class=no>Сложи равен брой монети на двете блюда.</span>';return}const w=a=>a.reduce((s,k)=>s+10+(k==fk?hv:0),0),c=Math.sign(w(L)-w(R)),n=a=>a.map(k=>k+1).join(', ');wl--;m.textContent='';$('#wh').innerHTML+=`${3-wl}) ${n(L)} срещу ${n(R)} → ${c?(c>0?'лявото блюдо е по-тежко':'дясното блюдо е по-тежко'):'равновесие'}<br>`;an(-c*14)};window.fg=d=>{const k=+$('#gc').value-1,m=$('#fm2');m.innerHTML=k==fk&&d==hv?`<span class=ok>✓ Браво! Монета ${fk+1} е ${hv<0?'по-лека':'по-тежка'}.</span> Използва ${3-wl} претегляния. При равновесие всички монети на везната са истински – така отпадат цели групи наведнъж.`:`<span class=no>✗ Не е точно.</span> ${k==fk?'Монетата е правилна, но провери посоката: накъде се наклони везната, когато тя е била на блюдо?':'Подсказка: монетите от претегляне с равновесие са истински. Коя остава подозрителна?'}`};fn()}};
const RV={t:"Задача: През реката",h:`<img class=pt src="${IMG.rv}" alt="Преминаване през реката"><p>Тази задача в Япония дават при постъпване на работа. Съставете алгоритъма за преминаване през реката. Всички трябва да преминат на другия бряг при следните условия:</p><ul><li>Полицаят не може да оставя престъпника сам с хората.</li><li>Татко не може да оставя синовете си с майката, а майката – дъщерите си с татко.</li><li>Децата не могат да плават сами на сала.</li><li>Салът не се връща празен и вози не повече от двама души.</li></ul><div class=card style="clear:both"><p>Играта се отваря направо на страницата. Натисни синия кръг, за да започне, после натискай героите и червената топка, за да плава салът.</p><p><a href="https://games.kidzsearch.com/computer/title/japanese-iq-test-15320" target=_blank rel=noopener>▶ Играй „Japanese IQ Test“ (задачата през реката)</a></p></div>`};
